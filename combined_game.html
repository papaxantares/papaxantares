<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Adventure - Drift Challenge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', monospace; }
        canvas { display: block; width: 100%; height: 100vh; }
        
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(0,0,0,0.8); padding: 15px 20px; border-radius: 10px; z-index: 100; backdrop-filter: blur(8px); font-size: 14px; }
        #ui h2 { font-size: 1.3rem; margin-bottom: 8px; color: #ffaa00; }
        .stat { margin: 4px 0; }
        .prompt { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #ffdd99; padding: 12px 25px; border-radius: 25px; border: 2px solid #ffaa00; text-align: center; z-index: 100; font-weight: bold; font-size: 14px; }
        
        #rpmPanel { position: absolute; bottom: 20px; right: 20px; width: 180px; background: rgba(0,0,0,0.9); padding: 12px; border-radius: 8px; z-index: 100; border: 2px solid #ff6600; display: none; }
        #rpmGauge { width: 100%; height: 130px; }
        #speedDisplay { text-align: center; color: #ffaa00; margin-top: 8px; font-weight: bold; font-size: 13px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="ui">
        <h2 id="title">🏝️ ISLA</h2>
        <div class="stat" id="status">Modo: Isla</div>
        <div class="stat" id="progress">Drift: 0/10000</div>
        <div class="stat" id="info">WASD: mover | E: interactuar | R: salir (drift)</div>
    </div>

    <div id="prompt" class="prompt hidden"></div>
    
    <div id="rpmPanel" class="hidden">
        <canvas id="rpmGauge" width="160" height="130"></canvas>
        <div id="speedDisplay">0 km/h</div>
    </div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script>
        // ==================== ESCENAS ====================
        let currentScene = 'island';
        let sceneObjects = {};

        const islandScene = new THREE.Scene();
        islandScene.background = new THREE.Color(0x87CEEB);
        islandScene.fog = new THREE.FogExp2(0x87CEEB, 0.004);

        const driftScene = new THREE.Scene();
        driftScene.background = new THREE.Color(0x1a1a1a);
        driftScene.fog = null;

        const boatScene = new THREE.Scene();
        boatScene.background = new THREE.Color(0x4da6ff);
        boatScene.fog = new THREE.FogExp2(0x4da6ff, 0.002);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ==================== ILUMINACIÓN ====================
        function createLighting(scene) {
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const dir = new THREE.DirectionalLight(0xfff5d0, 0.9);
            dir.position.set(20, 30, 10);
            dir.castShadow = true;
            dir.shadow.mapSize.width = 2048;
            dir.shadow.mapSize.height = 2048;
            dir.shadow.camera.far = 100;
            dir.shadow.camera.left = -50;
            dir.shadow.camera.right = 50;
            dir.shadow.camera.top = 50;
            dir.shadow.camera.bottom = -50;
            scene.add(dir);
        }

        createLighting(islandScene);
        createLighting(driftScene);
        createLighting(boatScene);

        // ==================== ESCENA ISLA ====================
        function setupIsland() {
            // Base
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(10, 10.2, 0.5, 64),
                new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.7 })
            );
            base.castShadow = true;
            base.receiveShadow = true;
            islandScene.add(base);

            // Pasto
            const grass = new THREE.Mesh(
                new THREE.CircleGeometry(9.9, 64),
                new THREE.MeshStandardMaterial({ color: 0x7cb342, roughness: 0.9 })
            );
            grass.rotation.x = -Math.PI / 2;
            grass.position.y = 0.24;
            grass.receiveShadow = true;
            islandScene.add(grass);

            // Casa
            const house = new THREE.Mesh(
                new THREE.BoxGeometry(6, 6, 6),
                new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 })
            );
            house.position.y = 3.25;
            house.castShadow = true;
            house.receiveShadow = true;
            islandScene.add(house);

            // Puerta
            const door = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 2.5, 0.2),
                new THREE.MeshStandardMaterial({ color: 0x111111 })
            );
            door.position.set(0, 1.5, 3.1);
            door.castShadow = true;
            door.userData.isDoor = true;
            islandScene.add(door);

            // Cúpula
            const dome = new THREE.Mesh(
                new THREE.SphereGeometry(2, 32, 32, 0, Math.PI * 2, 0, Math.PI / 2),
                new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00 })
            );
            dome.position.y = 6.5;
            dome.castShadow = true;
            islandScene.add(dome);

            // Agua
            const water = new THREE.Mesh(
                new THREE.PlaneGeometry(200, 200),
                new THREE.MeshStandardMaterial({ color: 0x2b7c9e, metalness: 0.8, roughness: 0.3 })
            );
            water.rotation.x = -Math.PI / 2;
            water.position.y = -0.3;
            water.receiveShadow = true;
            islandScene.add(water);

            // Lancha
            const boat = new THREE.Mesh(
                new THREE.BoxGeometry(2, 0.5, 3.5),
                new THREE.MeshStandardMaterial({ color: 0xd94a28, metalness: 0.7 })
            );
            boat.position.set(0, 0.12, -13);
            boat.castShadow = true;
            boat.userData.isBoat = true;
            islandScene.add(boat);

            sceneObjects.island = {
                door: door,
                boat: boat,
                water: water
            };
        }

        setupIsland();

        // ==================== ESCENA DRIFT ====================
        let driftCar = null;
        let driftCones = [];
        let driftVelocity = new THREE.Vector3();
        let driftRPM = 800;
        let driftScore = 0;
        let driftSpeed = 0;

        function setupDrift() {
            // Asfalto
            const asphalt = new THREE.Mesh(
                new THREE.PlaneGeometry(100, 150),
                new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.95 })
            );
            asphalt.rotation.x = -Math.PI / 2;
            asphalt.position.y = -0.05;
            asphalt.receiveShadow = true;
            driftScene.add(asphalt);

            // Paredes
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 });
            
            const wallBack = new THREE.Mesh(new THREE.BoxGeometry(100, 8, 1), wallMat);
            wallBack.position.set(0, 4, -75);
            wallBack.castShadow = true;
            driftScene.add(wallBack);

            const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(1, 8, 150), wallMat);
            wallLeft.position.set(-50, 4, 0);
            wallLeft.castShadow = true;
            driftScene.add(wallLeft);

            const wallRight = new THREE.Mesh(new THREE.BoxGeometry(1, 8, 150), wallMat);
            wallRight.position.set(50, 4, 0);
            wallRight.castShadow = true;
            driftScene.add(wallRight);

            // Coche
            driftCar = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.8, 0.5, 4),
                new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.2, metalness: 0.8 })
            );
            body.position.y = 0.35;
            body.castShadow = true;
            driftCar.add(body);

            const cabin = new THREE.Mesh(
                new THREE.BoxGeometry(1.4, 0.25, 1.2),
                new THREE.MeshStandardMaterial({ color: 0x222222 })
            );
            cabin.position.set(0, 0.65, -0.2);
            cabin.castShadow = true;
            driftCar.add(cabin);

            // Ruedas
            const tireGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
            const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            [[0.8, 1.3], [-0.8, 1.3], [0.8, -1.4], [-0.8, -1.4]].forEach(([x, z]) => {
                const wheel = new THREE.Mesh(tireGeo, tireMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(x, 0.3, z);
                wheel.castShadow = true;
                driftCar.add(wheel);
            });

            driftCar.position.set(0, 0.28, 0);
            driftScene.add(driftCar);

            // Conos
            driftCones = [];
            for (let i = 0; i < 40; i++) {
                let x, z;
                do {
                    x = (Math.random() - 0.5) * 80;
                    z = (Math.random() - 0.5) * 120;
                } while (Math.sqrt(x ** 2 + z ** 2) < 8);

                const cone = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.3, 0.45, 0.8, 8),
                    new THREE.MeshStandardMaterial({ color: 0xff6600 })
                );
                cone.position.set(x, 0.4, z);
                cone.castShadow = true;
                driftScene.add(cone);

                driftCones.push({
                    mesh: cone,
                    x: x,
                    z: z,
                    hit: false
                });
            }

            sceneObjects.drift = {
                car: driftCar,
                cones: driftCones
            };
        }

        setupDrift();

        // ==================== ESCENA LANCHA ====================
        function setupBoat() {
            // Agua oceano
            const ocean = new THREE.Mesh(
                new THREE.PlaneGeometry(500, 500),
                new THREE.MeshStandardMaterial({ color: 0x1a5276, metalness: 0.9, roughness: 0.2 })
            );
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -5;
            ocean.receiveShadow = true;
            boatScene.add(ocean);

            // Isla pequeña en la distancia
            const islandFar = new THREE.Mesh(
                new THREE.CylinderGeometry(8, 8, 0.5, 32),
                new THREE.MeshStandardMaterial({ color: 0x7cb342 })
            );
            islandFar.position.set(-100, -0.25, -100);
            boatScene.add(islandFar);

            // Lancha grande
            const boatHull = new THREE.Mesh(
                new THREE.BoxGeometry(3, 0.8, 5),
                new THREE.MeshStandardMaterial({ color: 0xd94a28, metalness: 0.7 })
            );
            boatHull.position.set(0, 0.4, 0);
            boatHull.castShadow = true;
            boatScene.add(boatHull);

            // Cabina
            const cabin = new THREE.Mesh(
                new THREE.BoxGeometry(2, 1.5, 2),
                new THREE.MeshStandardMaterial({ color: 0x9ad8ff, metalness: 0.3 })
            );
            cabin.position.set(0, 1.2, -0.5);
            cabin.castShadow = true;
            boatScene.add(cabin);

            sceneObjects.boat = { hull: boatHull };
        }

        setupBoat();

        // ==================== ESTADO ====================
        let gameState = {
            mode: 'island',
            driftTotal: 0,
            unlocked: false
        };

        // ==================== INPUT ====================
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;

            if (e.key.toLowerCase() === 'e') {
                handleInteraction();
            }
            if (e.key.toLowerCase() === 'r' && gameState.mode === 'drift') {
                exitDrift();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // ==================== MOUSE LOOK ====================
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let PI_2 = Math.PI / 2;

        document.addEventListener('click', () => {
            document.body.requestPointerLock = document.body.requestPointerLock || document.body.mozRequestPointerLock;
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                euler.setFromQuaternion(camera.quaternion);
                euler.rotateY(-e.movementX * 0.002);
                euler.rotateX(-e.movementY * 0.002);
                euler.z = 0;
                if (euler.x > PI_2) euler.x = PI_2;
                if (euler.x < -PI_2) euler.x = -PI_2;
                camera.quaternion.setFromEuler(euler);
            }
        });

        // ==================== MOVIMIENTO ====================
        const velocity = new THREE.Vector3();

        function updateIslandMovement(delta) {
            const dir = new THREE.Vector3();
            if (keys['w']) dir.z -= 1;
            if (keys['s']) dir.z += 1;
            if (keys['a']) dir.x -= 1;
            if (keys['d']) dir.x += 1;

            if (dir.length() > 0) {
                dir.normalize();
                velocity.add(dir.clone().multiplyScalar(20 * delta));
            } else {
                velocity.multiplyScalar(0.85);
            }
            velocity.clampLength(0, 12);

            camera.position.add(velocity.clone().multiplyScalar(delta));
        }

        // ==================== FÍSICA DRIFT ====================
        function updateDriftPhysics(delta) {
            const carPos = driftCar.position;
            const carDir = new THREE.Vector3(Math.sin(driftCar.rotation.y), 0, Math.cos(driftCar.rotation.y));

            let throttle = 0;
            if (keys['w']) throttle = 1;
            if (keys['s']) throttle = -1;
            let steer = 0;
            if (keys['a']) steer = -1;
            if (keys['d']) steer = 1;

            // Aceleración
            if (throttle > 0) {
                driftVelocity.add(carDir.clone().multiplyScalar(35 * delta));
                driftRPM = Math.min(9000, driftRPM + 2500 * delta);
            } else if (throttle < 0) {
                driftVelocity.add(carDir.clone().multiplyScalar(-22 * delta));
            } else {
                driftRPM = Math.max(800, driftRPM - 2000 * delta);
            }

            // Fricción
            if (driftVelocity.length() > 0.1) {
                driftVelocity.multiplyScalar(0.94);
            }

            driftVelocity.clampLength(0, 40);
            carPos.add(driftVelocity.clone().multiplyScalar(delta));
            driftSpeed = driftVelocity.length() * 3.6;

            // Rotación
            if (driftVelocity.length() > 2 && steer !== 0) {
                const rotSpeed = steer * driftVelocity.length() * 0.012;
                driftCar.rotation.y += rotSpeed * delta;
            }

            // Colisiones conos
            driftCones.forEach(cone => {
                if (!cone.hit && Math.hypot(carPos.x - cone.x, carPos.z - cone.z) < 1.2) {
                    cone.hit = true;
                    cone.mesh.material.color.setHex(0x555555);
                    driftScore -= 100;
                }
            });

            // Colisiones paredes
            if (carPos.x < -49) { carPos.x = -49; driftVelocity.x *= -0.3; driftScore = Math.max(0, driftScore - 50); }
            if (carPos.x > 49) { carPos.x = 49; driftVelocity.x *= -0.3; driftScore = Math.max(0, driftScore - 50); }
            if (carPos.z < -74) { carPos.z = -74; driftVelocity.z *= -0.3; driftScore = Math.max(0, driftScore - 50); }
            if (carPos.z > 60) { carPos.z = 60; driftVelocity.z *= -0.3; driftScore = Math.max(0, driftScore - 50); }

            // Drift scoring
            if (driftVelocity.length() > 8 && Math.abs(steer) > 0.3) {
                const driftFactor = Math.abs(steer) * (driftVelocity.length() / 40);
                driftScore += driftFactor * 150 * delta;
            }

            // Cámara follow
            const behindDist = 18;
            const target = carPos.clone().add(carDir.clone().negate().multiplyScalar(behindDist));
            target.y = 4;
            camera.position.lerp(target, 0.08);
            camera.lookAt(carPos.x, carPos.y + 1, carPos.z);
        }

        // ==================== TRANSICIONES ====================
        function enterDrift() {
            gameState.mode = 'drift';
            driftVelocity.set(0, 0, 0);
            driftRPM = 800;
            driftScore = 0;
            driftCar.position.set(0, 0.28, 0);
            driftCones.forEach(c => c.hit = false);
            driftCones.forEach(c => c.mesh.material.color.setHex(0xff6600));

            camera.position.set(0, 8, 30);
            camera.lookAt(0, 0, 0);
            document.getElementById('rpmPanel').classList.remove('hidden');
            document.getElementById('title').textContent = '🏁 DRIFT GARAGE';
            updateUI();
        }

        function exitDrift() {
            gameState.mode = 'island';
            gameState.driftTotal += driftScore;
            if (gameState.driftTotal >= 10000) {
                gameState.unlocked = true;
            }

            camera.position.set(8, 1.6, 8);
            camera.lookAt(0, 1, 0);
            document.getElementById('rpmPanel').classList.add('hidden');
            document.getElementById('title').textContent = '🏝️ ISLA';
            updateUI();
        }

        function enterBoat() {
            gameState.mode = 'boat';
            camera.position.set(0, 2, 5);
            camera.lookAt(0, 0, 0);
            document.getElementById('title').textContent = '⛵ LANCHA';
            updateUI();
        }

        function exitBoat() {
            gameState.mode = 'island';
            camera.position.set(8, 1.6, 8);
            camera.lookAt(0, 1, 0);
            document.getElementById('title').textContent = '🏝️ ISLA';
            updateUI();
        }

        // ==================== INTERACCIÓN ====================
        function handleInteraction() {
            if (gameState.mode === 'island') {
                const doorPos = new THREE.Vector3(0, 1.5, 3.1);
                const boatPos = new THREE.Vector3(0, 0.12, -13);
                const camDist1 = camera.position.distanceTo(doorPos);
                const camDist2 = camera.position.distanceTo(boatPos);

                if (camDist1 < 6) {
                    enterDrift();
                } else if (camDist2 < 6 && gameState.unlocked) {
                    enterBoat();
                }
            } else if (gameState.mode === 'boat') {
                exitBoat();
            }
        }

        // ==================== UI ====================
        function updateUI() {
            const prompt = document.getElementById('prompt');
            const doorPos = new THREE.Vector3(0, 1.5, 3.1);
            const boatPos = new THREE.Vector3(0, 0.12, -13);

            if (gameState.mode === 'island') {
                const d1 = camera.position.distanceTo(doorPos);
                const d2 = camera.position.distanceTo(boatPos);

                if (d1 < 6) {
                    prompt.textContent = '🚗 Pulsa E para entrar al DRIFT GARAGE';
                    prompt.classList.remove('hidden');
                } else if (d2 < 6) {
                    if (gameState.unlocked) {
                        prompt.textContent = '⛵ Pulsa E para subir a la LANCHA';
                    } else {
                        prompt.textContent = `⛵ Necesitas ${10000 - gameState.driftTotal} puntos más (Drift: ${gameState.driftTotal}/10000)`;
                    }
                    prompt.classList.remove('hidden');
                } else {
                    prompt.classList.add('hidden');
                }
            } else if (gameState.mode === 'drift') {
                prompt.textContent = `🏁 DRIFT: ${Math.floor(driftScore)} | VELOCIDAD: ${Math.floor(driftSpeed)} km/h | Pulsa R para salir`;
                prompt.classList.remove('hidden');
            } else if (gameState.mode === 'boat') {
                prompt.textContent = '⛵ Pulsa E para desembarcar';
                prompt.classList.remove('hidden');
            }

            document.getElementById('status').textContent = `Modo: ${gameState.mode === 'island' ? 'ISLA' : gameState.mode === 'drift' ? 'DRIFT' : 'LANCHA'}`;
            document.getElementById('progress').textContent = `Drift: ${gameState.driftTotal}/10000`;
        }

        // ==================== RPM GAUGE ====================
        const rpmCanvas = document.getElementById('rpmGauge');
        const rpmCtx = rpmCanvas.getContext('2d');

        function drawRPMGauge() {
            const w = rpmCanvas.width, h = rpmCanvas.height;
            rpmCtx.clearRect(0, 0, w, h);

            const cx = w / 2, cy = h / 2, radius = 50;

            rpmCtx.fillStyle = '#1a1a1a';
            rpmCtx.beginPath();
            rpmCtx.arc(cx, cy, radius, 0, Math.PI * 2);
            rpmCtx.fill();
            rpmCtx.strokeStyle = '#666';
            rpmCtx.lineWidth = 2;
            rpmCtx.stroke();

            rpmCtx.fillStyle = '#fff';
            rpmCtx.font = '9px Arial';
            for (let i = 0; i <= 9; i++) {
                const angle = -Math.PI * 0.75 + (i / 9) * Math.PI * 1.5;
                const x1 = cx + Math.cos(angle) * (radius - 3);
                const y1 = cy + Math.sin(angle) * (radius - 3);
                const x2 = cx + Math.cos(angle) * (radius - 12);
                const y2 = cy + Math.sin(angle) * (radius - 12);
                rpmCtx.beginPath();
                rpmCtx.moveTo(x1, y1);
                rpmCtx.lineTo(x2, y2);
                rpmCtx.stroke();

                const labelX = cx + Math.cos(angle) * (radius - 22);
                const labelY = cy + Math.sin(angle) * (radius - 22);
                rpmCtx.fillText(i * 1000, labelX - 8, labelY + 3);
            }

            const needleAngle = -Math.PI * 0.75 + (driftRPM / 9000) * Math.PI * 1.5;
            rpmCtx.strokeStyle = '#ff6600';
            rpmCtx.lineWidth = 3;
            rpmCtx.beginPath();
            rpmCtx.moveTo(cx, cy);
            rpmCtx.lineTo(cx + Math.cos(needleAngle) * (radius - 12), cy + Math.sin(needleAngle) * (radius - 12));
            rpmCtx.stroke();

            rpmCtx.fillStyle = '#000';
            rpmCtx.beginPath();
            rpmCtx.arc(cx, cy, 6, 0, Math.PI * 2);
            rpmCtx.fill();
        }

        // ==================== RENDER LOOP ====================
        const clock = new THREE.Clock();

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.016);

            // Cambiar escena
            if (currentScene !== gameState.mode) {
                currentScene = gameState.mode;
                renderer.render(
                    gameState.mode === 'island' ? islandScene : gameState.mode === 'drift' ? driftScene : boatScene,
                    camera
                );
            } else {
                renderer.render(
                    gameState.mode === 'island' ? islandScene : gameState.mode === 'drift' ? driftScene : boatScene,
                    camera
                );
            }

            // Update
            if (gameState.mode === 'island') {
                updateIslandMovement(delta);
            } else if (gameState.mode === 'drift') {
                updateDriftPhysics(delta);
                drawRPMGauge();
            }

            updateUI();
            requestAnimationFrame(animate);
        }

        animate();

        // ==================== RESIZE ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
