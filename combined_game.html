<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Island Adventure - Drift Challenge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', monospace; }
        canvas { display: block; width: 100%; height: 100vh; }
        
        #ui { position: absolute; top: 20px; left: 20px; color: #fff; background: rgba(0,0,0,0.8); padding: 15px 20px; border-radius: 10px; z-index: 100; backdrop-filter: blur(8px); }
        #ui h2 { font-size: 1.5rem; margin-bottom: 10px; color: #ffaa00; }
        .stat { margin: 5px 0; font-size: 0.9rem; }
        .prompt { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #ffdd99; padding: 15px 30px; border-radius: 30px; border: 2px solid #ffaa00; text-align: center; z-index: 100; font-weight: bold; }
        
        #rpmPanel { position: absolute; bottom: 20px; right: 20px; width: 200px; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 10px; z-index: 100; border: 2px solid #ff6600; display: none; }
        #rpmGauge { width: 100%; height: 150px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="ui">
        <h2 id="title">🏝️ SAINT LITTLE JAMES</h2>
        <div class="stat" id="status">Estado: En la isla</div>
        <div class="stat" id="progress">Progreso: 0/10000 puntos</div>
        <div class="stat" id="info">Controles: WASD movimiento, Ratón mirar</div>
    </div>

    <div id="prompt" class="prompt hidden"></div>
    
    <div id="rpmPanel" class="hidden">
        <canvas id="rpmGauge" width="180" height="150"></canvas>
        <div style="text-align: center; color: #ffaa00; margin-top: 10px; font-weight: bold;" id="speedDisplay">0 km/h</div>
    </div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script>
        // ========================== CONFIG ==========================
        const CONFIG = {
            ISLAND_RADIUS: 10,
            DRIFT_REQUIREMENT: 10000,
            GROUND_Y: 0.25,
            EYE_HEIGHT: 1.6
        };

        // ========================== STATE ==========================
        let gameState = {
            mode: 'island', // island, drift, boat
            driftTotal: 0,
            driftSession: 0,
            unlocked: false
        };

        // ========================== THREE.JS SETUP ==========================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.004);
        camera.position.set(8, 2.1, 8);

        // ========================== LIGHTING ==========================
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfff5d0, 0.9);
        dirLight.position.set(20, 30, 10);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.left = -50;
        dirLight.shadow.camera.right = 50;
        dirLight.shadow.camera.top = 50;
        dirLight.shadow.camera.bottom = -50;
        scene.add(dirLight);

        // ========================== ISLAND OBJECTS ==========================
        function createIsland() {
            // Base isla
            const baseMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.7 });
            const baseGeo = new THREE.CylinderGeometry(CONFIG.ISLAND_RADIUS, CONFIG.ISLAND_RADIUS + 0.2, 0.5, 64);
            const base = new THREE.Mesh(baseGeo, baseMat);
            base.castShadow = true;
            base.receiveShadow = true;
            scene.add(base);

            // Grass
            const grassGeo = new THREE.CircleGeometry(CONFIG.ISLAND_RADIUS - 0.1, 64);
            const grassMat = new THREE.MeshStandardMaterial({ color: 0x7cb342, roughness: 0.9 });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI / 2;
            grass.position.y = CONFIG.GROUND_Y - 0.01;
            grass.receiveShadow = true;
            scene.add(grass);

            // Casa
            const houseGeo = new THREE.BoxGeometry(6, 6, 6);
            const houseMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
            const house = new THREE.Mesh(houseGeo, houseMat);
            house.position.y = 3.25;
            house.castShadow = true;
            house.receiveShadow = true;
            scene.add(house);

            // Puerta
            const doorGeo = new THREE.BoxGeometry(1.5, 2.5, 0.2);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.set(0, 1.5, 3.1);
            door.castShadow = true;
            door.userData.type = 'door';
            scene.add(door);

            // Cúpula
            const domeGeo = new THREE.SphereGeometry(2, 32, 32, 0, Math.PI * 2, 0, Math.PI / 2);
            const domeMat = new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0xffaa00 });
            const dome = new THREE.Mesh(domeGeo, domeMat);
            dome.position.y = 6.5;
            dome.castShadow = true;
            scene.add(dome);

            // Agua
            const waterGeo = new THREE.PlaneGeometry(200, 200);
            const waterMat = new THREE.MeshStandardMaterial({ color: 0x2b7c9e, metalness: 0.8, roughness: 0.3 });
            const water = new THREE.Mesh(waterGeo, waterMat);
            water.rotation.x = -Math.PI / 2;
            water.position.y = -0.3;
            water.receiveShadow = true;
            water.userData.type = 'water';
            scene.add(water);

            // Lancha
            const boatGeo = new THREE.BoxGeometry(2, 0.5, 3.5);
            const boatMat = new THREE.MeshStandardMaterial({ color: 0xd94a28, metalness: 0.7, roughness: 0.4 });
            const boat = new THREE.Mesh(boatGeo, boatMat);
            boat.position.set(0, 0.12, -CONFIG.ISLAND_RADIUS - 3);
            boat.castShadow = true;
            boat.userData.type = 'boat';
            scene.add(boat);
        }

        createIsland();

        // ========================== GARAJE DRIFT ==========================
        function createDriftGarage() {
            // Asfalto
            const asphaltGeo = new THREE.PlaneGeometry(100, 150);
            const asphaltMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.95 });
            const asphalt = new THREE.Mesh(asphaltGeo, asphaltMat);
            asphalt.rotation.x = -Math.PI / 2;
            asphalt.position.set(30, -0.1, 0);
            asphalt.receiveShadow = true;
            asphalt.userData.type = 'garage';
            scene.add(asphalt);

            // Paredes garaje
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.6 });
            
            // Pared trasera
            const wallBackGeo = new THREE.BoxGeometry(100, 8, 1);
            const wallBack = new THREE.Mesh(wallBackGeo, wallMat);
            wallBack.position.set(30, 4, -76);
            wallBack.castShadow = true;
            scene.add(wallBack);

            // Paredes laterales
            const wallSideGeo = new THREE.BoxGeometry(1, 8, 150);
            const wallLeft = new THREE.Mesh(wallSideGeo, wallMat);
            wallLeft.position.set(-20, 4, 0);
            wallLeft.castShadow = true;
            scene.add(wallLeft);

            const wallRight = new THREE.Mesh(wallSideGeo, wallMat);
            wallRight.position.set(80, 4, 0);
            wallRight.castShadow = true;
            scene.add(wallRight);
        }

        createDriftGarage();

        // ========================== COCHE DRIFT ==========================
        let driftCar = null;

        function createDriftCar() {
            const carGroup = new THREE.Group();
            
            // Carrocería
            const bodyGeo = new THREE.BoxGeometry(1.8, 0.5, 4);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, roughness: 0.2, metalness: 0.8 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.35;
            body.castShadow = true;
            carGroup.add(body);

            // Cabina
            const cabinGeo = new THREE.BoxGeometry(1.4, 0.25, 1.2);
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
            const cabin = new THREE.Mesh(cabinGeo, cabinMat);
            cabin.position.set(0, 0.65, -0.2);
            cabin.castShadow = true;
            carGroup.add(cabin);

            // Ruedas
            const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const tireGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
            
            const positions = [[0.8, 1.3], [-0.8, 1.3], [0.8, -1.4], [-0.8, -1.4]];
            positions.forEach(([x, z]) => {
                const wheel = new THREE.Mesh(tireGeo, wheelMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(x, 0.3, z);
                wheel.castShadow = true;
                carGroup.add(wheel);
            });

            carGroup.position.set(30, 0.28, 0);
            carGroup.userData.type = 'driftcar';
            scene.add(carGroup);
            return carGroup;
        }

        driftCar = createDriftCar();

        // ========================== CONOS DRIFT ==========================
        let driftCones = [];

        function createDriftCones() {
            driftCones = [];
            for (let i = 0; i < 40; i++) {
                let x, z;
                do {
                    x = 30 + (Math.random() - 0.5) * 60;
                    z = (Math.random() - 0.5) * 120;
                } while (Math.sqrt((x - 30) ** 2 + z ** 2) < 8);

                const coneGeo = new THREE.CylinderGeometry(0.3, 0.45, 0.8, 8);
                const coneMat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
                const cone = new THREE.Mesh(coneGeo, coneMat);
                cone.position.set(x, 0.4, z);
                cone.castShadow = true;
                scene.add(cone);

                driftCones.push({
                    mesh: cone,
                    pos: new THREE.Vector3(x, 0.4, z),
                    hit: false,
                    originalColor: 0xff6600
                });
            }
        }

        createDriftCones();

        // ========================== INPUT ==========================
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;

            if (e.key.toLowerCase() === 'e') {
                const doorPos = new THREE.Vector3(0, 1.5, 3.1);
                const boatPos = new THREE.Vector3(0, 0.12, -CONFIG.ISLAND_RADIUS - 3);
                const camPos = camera.position;

                if (gameState.mode === 'island') {
                    if (camPos.distanceTo(doorPos) < 5) {
                        enterDrift();
                    } else if (camPos.distanceTo(boatPos) < 5 && gameState.unlocked) {
                        enterBoat();
                    }
                } else if (gameState.mode === 'drift') {
                    exitDrift();
                } else if (gameState.mode === 'boat') {
                    exitBoat();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        // ========================== POINTER LOCK ==========================
        let mouseX = 0, mouseY = 0;
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let PI_2 = Math.PI / 2;

        document.addEventListener('click', () => {
            document.body.requestPointerLock = document.body.requestPointerLock || document.body.mozRequestPointerLock;
            document.body.requestPointerLock();
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                euler.setFromQuaternion(camera.quaternion);
                euler.rotateY(-e.movementX * 0.002);
                euler.rotateX(-e.movementY * 0.002);
                euler.z = 0;
                if (euler.x > PI_2) euler.x = PI_2;
                if (euler.x < -PI_2) euler.x = -PI_2;
                camera.quaternion.setFromEuler(euler);
            }
        });

        // ========================== MOVEMENT ==========================
        const velocity = new THREE.Vector3();
        const acceleration = 20;

        function updateMovement(delta) {
            const direction = new THREE.Vector3();
            if (keys['w']) direction.z -= 1;
            if (keys['s']) direction.z += 1;
            if (keys['a']) direction.x -= 1;
            if (keys['d']) direction.x += 1;

            if (direction.length() > 0) {
                direction.normalize();
                velocity.add(direction.clone().multiplyScalar(acceleration * delta));
            } else {
                velocity.multiplyScalar(0.8);
            }

            velocity.clampLength(0, 15);

            const newPos = camera.position.clone().add(velocity.clone().multiplyScalar(delta));
            camera.position.copy(newPos);
        }

        // ========================== DRIFT PHYSICS ==========================
        let driftVelocity = new THREE.Vector3();
        let driftSpeed = 0;
        let driftRPM = 800;
        let driftGear = 0;
        let driftScore = 0;

        function updateDriftPhysics(delta) {
            if (gameState.mode !== 'drift') return;

            const carPos = driftCar.position;
            const carDir = new THREE.Vector3(Math.sin(driftCar.rotation.y), 0, Math.cos(driftCar.rotation.y));

            // Input
            let throttle = 0;
            if (keys['w']) throttle = 1;
            if (keys['s']) throttle = -1;
            let steer = 0;
            if (keys['a']) steer = 1;
            if (keys['d']) steer = -1;

            // Aceleración
            if (throttle > 0) {
                driftVelocity.add(carDir.clone().multiplyScalar(30 * delta));
                driftRPM = Math.min(9000, driftRPM + 2000 * delta);
            } else if (throttle < 0) {
                driftVelocity.add(carDir.clone().multiplyScalar(-20 * delta));
            } else {
                driftRPM = Math.max(800, driftRPM - 1500 * delta);
            }

            // Fricción y resistencia
            const speed = driftVelocity.length();
            if (speed > 0.1) {
                const drag = 0.95;
                driftVelocity.multiplyScalar(drag);
            }

            // Velocidad máxima
            driftVelocity.clampLength(0, 35);

            // Movimiento
            carPos.add(driftVelocity.clone().multiplyScalar(delta));
            driftSpeed = speed * 3.6;

            // Rotación
            if (speed > 1 && steer !== 0) {
                const rotationSpeed = steer * speed * 0.01;
                driftCar.rotation.y += rotationSpeed * delta;
            }

            // Colisiones con conos
            const carRadius = 1;
            driftCones.forEach(cone => {
                if (!cone.hit && carPos.distanceTo(cone.pos) < carRadius + 0.3) {
                    cone.hit = true;
                    cone.mesh.material.color.setHex(0x555555);
                    driftScore -= 100;
                }
            });

            // Colisiones con paredes
            const boundaries = {
                minX: -20 + 1,
                maxX: 80 - 1,
                minZ: -76 + 1,
                maxZ: 60
            };

            if (carPos.x < boundaries.minX) {
                carPos.x = boundaries.minX;
                driftVelocity.x *= -0.3;
                driftScore = Math.max(0, driftScore - 50);
            }
            if (carPos.x > boundaries.maxX) {
                carPos.x = boundaries.maxX;
                driftVelocity.x *= -0.3;
                driftScore = Math.max(0, driftScore - 50);
            }
            if (carPos.z < boundaries.minZ) {
                carPos.z = boundaries.minZ;
                driftVelocity.z *= -0.3;
                driftScore = Math.max(0, driftScore - 50);
            }
            if (carPos.z > boundaries.maxZ) {
                carPos.z = boundaries.maxZ;
                driftVelocity.z *= -0.3;
                driftScore = Math.max(0, driftScore - 50);
            }

            // Cálculo de drift
            if (speed > 5 && Math.abs(steer) > 0.3) {
                const driftFactor = Math.abs(steer) * (speed / 35);
                driftScore += driftFactor * 100 * delta;
            }

            // Cámara follow
            const behindDistance = 15;
            const cameraTarget = carPos.clone().add(carDir.clone().negate().multiplyScalar(behindDistance));
            cameraTarget.y = 3;
            camera.position.lerp(cameraTarget, 0.1);
            camera.lookAt(carPos.x, carPos.y + 1, carPos.z);
        }

        // ========================== GAME STATE TRANSITIONS ==========================
        function enterDrift() {
            gameState.mode = 'drift';
            gameState.driftSession = 0;
            driftVelocity.set(0, 0, 0);
            driftRPM = 800;
            driftScore = 0;
            driftCar.position.set(30, 0.28, 0);
            driftCones.forEach(c => {
                c.hit = false;
                c.mesh.material.color.setHex(c.originalColor);
            });

            camera.position.set(30, 8, 25);
            document.getElementById('rpmPanel').classList.remove('hidden');
            document.getElementById('title').textContent = '🏁 DRIFT GARAGE';
            updateUI();
        }

        function exitDrift() {
            gameState.mode = 'island';
            gameState.driftTotal += driftScore;
            if (gameState.driftTotal >= CONFIG.DRIFT_REQUIREMENT) {
                gameState.unlocked = true;
            }

            camera.position.set(8, 2.1, 8);
            document.getElementById('rpmPanel').classList.add('hidden');
            document.getElementById('title').textContent = '🏝️ SAINT LITTLE JAMES';
            updateUI();
        }

        function enterBoat() {
            gameState.mode = 'boat';
            camera.position.set(0, 2, -15);
            updateUI();
        }

        function exitBoat() {
            gameState.mode = 'island';
            camera.position.set(8, 2.1, 8);
            updateUI();
        }

        // ========================== UI ==========================
        function updateUI() {
            const prompt = document.getElementById('prompt');
            const doorPos = new THREE.Vector3(0, 1.5, 3.1);
            const boatPos = new THREE.Vector3(0, 0.12, -CONFIG.ISLAND_RADIUS - 3);
            const camPos = camera.position;
            const doorDist = camPos.distanceTo(doorPos);
            const boatDist = camPos.distanceTo(boatPos);

            if (gameState.mode === 'island') {
                if (doorDist < 5) {
                    prompt.textContent = '🚗 Pulsa E para entrar al garage';
                    prompt.classList.remove('hidden');
                } else if (boatDist < 5) {
                    if (gameState.unlocked) {
                        prompt.textContent = '⛵ Pulsa E para subir a la lancha';
                    } else {
                        prompt.textContent = `⛵ Completa el drift primero (${gameState.driftTotal}/10000)`;
                    }
                    prompt.classList.remove('hidden');
                } else {
                    prompt.classList.add('hidden');
                }
            } else if (gameState.mode === 'drift') {
                prompt.textContent = `🏁 Drift: ${Math.floor(driftScore)} | Velocidad: ${Math.floor(driftSpeed)} km/h | Pulsa R para salir`;
                prompt.classList.remove('hidden');
            } else if (gameState.mode === 'boat') {
                prompt.textContent = '⛵ Pulsa E para desembarcar';
                prompt.classList.remove('hidden');
            }

            document.getElementById('status').textContent = `Estado: ${gameState.mode === 'island' ? 'En la isla' : gameState.mode === 'drift' ? 'Garage de Drift' : 'En la lancha'}`;
            document.getElementById('progress').textContent = `Progreso: ${gameState.driftTotal}/10000 puntos`;
            document.getElementById('info').textContent = gameState.mode === 'drift' ? 'WASD: movimiento, E: salir' : 'WASD: movimiento, Ratón: mirar, E: interactuar';
        }

        // ========================== RPM GAUGE ==========================
        const rpmCanvas = document.getElementById('rpmGauge');
        const rpmCtx = rpmCanvas.getContext('2d');

        function drawRPMGauge() {
            const w = rpmCanvas.width, h = rpmCanvas.height;
            rpmCtx.clearRect(0, 0, w, h);

            const cx = w / 2, cy = h / 2, radius = 60;
            
            // Círculo
            rpmCtx.fillStyle = '#1a1a1a';
            rpmCtx.beginPath();
            rpmCtx.arc(cx, cy, radius, 0, Math.PI * 2);
            rpmCtx.fill();
            rpmCtx.strokeStyle = '#666';
            rpmCtx.lineWidth = 2;
            rpmCtx.stroke();

            // Marcas
            rpmCtx.fillStyle = '#fff';
            rpmCtx.font = 'bold 10px Arial';
            for (let i = 0; i <= 9; i++) {
                const angle = -Math.PI * 0.75 + (i / 9) * Math.PI * 1.5;
                const x1 = cx + Math.cos(angle) * (radius - 5);
                const y1 = cy + Math.sin(angle) * (radius - 5);
                const x2 = cx + Math.cos(angle) * (radius - 15);
                const y2 = cy + Math.sin(angle) * (radius - 15);
                rpmCtx.beginPath();
                rpmCtx.moveTo(x1, y1);
                rpmCtx.lineTo(x2, y2);
                rpmCtx.stroke();

                const rpm = i * 1000;
                const labelX = cx + Math.cos(angle) * (radius - 25);
                const labelY = cy + Math.sin(angle) * (radius - 25);
                rpmCtx.fillText(rpm, labelX - 10, labelY + 3);
            }

            // Aguja
            const needleAngle = -Math.PI * 0.75 + (driftRPM / 9000) * Math.PI * 1.5;
            rpmCtx.strokeStyle = '#ff6600';
            rpmCtx.lineWidth = 3;
            rpmCtx.beginPath();
            rpmCtx.moveTo(cx, cy);
            rpmCtx.lineTo(cx + Math.cos(needleAngle) * (radius - 15), cy + Math.sin(needleAngle) * (radius - 15));
            rpmCtx.stroke();

            // Centro
            rpmCtx.fillStyle = '#000';
            rpmCtx.beginPath();
            rpmCtx.arc(cx, cy, 8, 0, Math.PI * 2);
            rpmCtx.fill();

            document.getElementById('speedDisplay').textContent = `${Math.floor(driftSpeed)} km/h`;
        }

        // ========================== MAIN LOOP ==========================
        const clock = new THREE.Clock();

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.016);

            if (gameState.mode === 'island') {
                updateMovement(delta);
            } else if (gameState.mode === 'drift') {
                updateDriftPhysics(delta);
                drawRPMGauge();
            }

            updateUI();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // ========================== RESIZE ==========================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
